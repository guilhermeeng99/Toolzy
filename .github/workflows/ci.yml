name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint + format (Biome)
        run: pnpm dlx @biomejs/biome@1.9.4 ci .

      - name: Build app (typecheck + Vite)
        run: |
          pnpm -C app install
          pnpm -C app build

      - name: Build site (Vite)
        run: |
          pnpm -C site install
          pnpm -C site build

  # Rust (cargo test) runs locally / on release builds: it needs the Tauri Linux
  # system deps + the sidecar binaries present, which are out of scope for this
  # lightweight CI. See app/README.md.
