name: Release

# Pushes to main run CI and publish a release only after it passes. PRs run CI
# only. A weekly schedule publishes the same signed app update only when yt-dlp
# has a newer tracked release. The release job skips its own bump commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Check weekly for a new yt-dlp extractor release. A build is published only
    # when its upstream version differs from app/src-tauri/ytdlp-version.txt.
    - cron: "17 9 * * 1"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci (lint · build · test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint + format (Biome)
        run: pnpm dlx @biomejs/biome@1.9.4 ci .

      - name: Build app (typecheck + Vite)
        run: |
          pnpm -C app install
          pnpm -C app build

      - name: Build site (Vite)
        run: |
          pnpm -C site install
          pnpm -C site build

      # Rust engine tests. This step gates the release: `release` needs `ci`, so a
      # red test blocks publishing. tauri-build validates externalBin + pdfium, so
      # the binaries must be present; `generate_context!` embeds `dist` (built above).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Fetch bundled binaries (yt-dlp, ffmpeg, pdfium)
        run: node app/scripts/fetch-binaries.mjs

      - name: Clippy (Rust lints, warnings = errors)
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test (Rust engine)
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

  freshness:
    name: yt-dlp freshness
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Compare tracked and latest yt-dlp
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          latest=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | jq -r .tag_name)
          tracked=$(tr -d '\r\n' < app/src-tauri/ytdlp-version.txt)
          proceed=true
          if [[ "$EVENT_NAME" == "schedule" && "$latest" == "$tracked" ]]; then
            proceed=false
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "tracked=$tracked latest=$latest proceed=$proceed"

  release:
    name: bump · build · publish
    runs-on: windows-latest
    needs: [ci, freshness]
    if: >-
      needs.freshness.outputs.proceed == 'true' &&
      (github.event_name != 'push' ||
      (github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record bundled yt-dlp version
        shell: bash
        run: printf '%s\n' '${{ needs.freshness.outputs.latest }}' > app/src-tauri/ytdlp-version.txt

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          current=$(jq -r .version app/src-tauri/tauri.conf.json)
          IFS=. read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          tmp=$(mktemp)
          jq --arg v "$next" '.version = $v' app/src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" app/src-tauri/tauri.conf.json
          sed -i -E "0,/^version = \".*\"$/ s//version = \"$next\"/" app/src-tauri/Cargo.toml
          # Keep the app manifest in lockstep (cosmetic, but avoids version drift).
          tmp=$(mktemp)
          jq --arg v "$next" '.version = $v' app/package.json > "$tmp"
          mv "$tmp" app/package.json
          echo "bumped $current -> $next"

      - name: Commit, tag, push
        shell: bash
        run: |
          set -euo pipefail
          next="${{ steps.bump.outputs.next }}"
          git add app/src-tauri/tauri.conf.json app/src-tauri/Cargo.toml app/src-tauri/ytdlp-version.txt app/package.json
          git commit -m "chore(release): v${next} [skip ci]"
          git tag "v${next}"
          git push origin main
          git push origin "v${next}"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install app dependencies
        run: pnpm -C app install

      - name: Fetch bundled binaries (yt-dlp, ffmpeg, pdfium)
        run: node app/scripts/fetch-binaries.mjs

      - name: Build & publish installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the build + emits latest.json so the in-app updater can verify updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v${{ steps.bump.outputs.next }}
          releaseName: 'Toolzy v${{ steps.bump.outputs.next }}'
          releaseBody: |
            Auto-released from `main` @ ${{ github.sha }}.

            Bundled yt-dlp: `${{ needs.freshness.outputs.latest }}`.

            Download the installer (`.exe` NSIS or `.msi`) for Windows and run it. ffmpeg,
            yt-dlp and pdfium are bundled — nothing else to download.

            > **First install:** Toolzy is unsigned, so Windows SmartScreen may warn
            > "Unrecognized app". Click **More info → Run anyway**.
          releaseDraft: false
          prerelease: false
