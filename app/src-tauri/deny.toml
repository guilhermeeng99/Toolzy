# cargo-deny / cargo-audit advisory policy for Toolzy.
#
# `cargo audit` reports 0 vulnerabilities; the entries below are all *informational*
# advisories (unmaintained / unsound, no CVE) that arrive **transitively** through
# Tauri's stack — none is a direct Toolzy dependency, so none is independently
# fixable from this Cargo.toml. They clear only when Tauri/wry upgrade upstream
# (notably the move off GTK3). Listing them keeps an advisory run green without
# silencing the whole category, so a *new* advisory still surfaces.
#
# Run: `cargo audit --file Cargo.lock`  (ignores below mirror these IDs)
#  or: `cargo deny check advisories`
#
# Revisit when bumping Tauri (`cargo update -p tauri -p wry`).

[advisories]
version = 2
ignore = [
    # gtk-rs GTK3 bindings — unmaintained. Linux-only WebKitGTK backend via
    # tauri -> tauri-runtime-wry -> wry -> gtk; NOT compiled into the Windows
    # (WebView2) build that Toolzy ships.
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0429", # glib — unsound VariantStrIter iterator (same GTK3 stack)
    # Build-time / transitive proc-macro + IDNA deps (unmaintained, no runtime impact).
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]
