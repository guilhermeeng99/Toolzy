[package]
name = "toolzy"
version = "0.1.0"
description = "Toolzy — native desktop file toolbox"
authors = ["Guilherme Passos"]
edition = "2021"

[lib]
name = "toolzy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# Native image pipeline (pure Rust, compiled in — no external binary).
image = "0.25"
