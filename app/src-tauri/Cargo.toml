[package]
name = "toolzy"
version = "0.1.3"
description = "Toolzy — native desktop file toolbox"
authors = ["Guilherme Passos"]
edition = "2021"

[lib]
name = "toolzy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native image pipeline. `image` covers png/jpg/gif/bmp/tiff/ico (decode+encode) and
# webp/avif decode; `webp` adds lossy webp *encoding* (libwebp).
image = "0.25"
webp = "0.3"
# Native PDF. pdfium-render loads the pdfium library at runtime (shipped beside the
# exe / fetched); printpdf builds PDFs from images (pure Rust).
pdfium-render = "0.8"
printpdf = "0.7"
